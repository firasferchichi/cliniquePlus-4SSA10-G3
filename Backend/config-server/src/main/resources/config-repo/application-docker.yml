# Surcharges communes quand tout tourne dans Docker Compose
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
spring:
  rabbitmq:
    host: rabbitmq
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/clinique/protocol/openid-connect/certs
clinique:
  security:
    enabled: true
